name: CD Dev VPS

on:
  push:
    branches: [dev-bao, dev]
  workflow_dispatch:

concurrency:
  group: dev-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Dev VPS
    runs-on: ubuntu-latest
    environment: dev-vps

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/freshflow_vps_key
          chmod 600 ~/.ssh/freshflow_vps_key
          ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/freshflow_vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            bash -s -- "$DEPLOY_PATH" "$DEPLOY_BRANCH" <<'EOF'
          set -euo pipefail

          DEPLOY_PATH="$1"
          DEPLOY_BRANCH="$2"

          cd "$DEPLOY_PATH"

          git fetch origin "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"

          test -f .env.dev-vps
          docker compose --env-file .env.dev-vps -f docker-compose.dev-vps.yml config >/dev/null
          docker compose --env-file .env.dev-vps -f docker-compose.dev-vps.yml up -d --build --remove-orphans

          API_PORT="$(awk -F= '/^API_PORT=/{print $2}' .env.dev-vps | tail -n 1)"
          API_PORT="${API_PORT:-8080}"

          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${API_PORT}/health"; then
              break
            fi

            if [ "$i" -eq 30 ]; then
              docker compose --env-file .env.dev-vps -f docker-compose.dev-vps.yml logs --tail=120 api
              exit 1
            fi

            sleep 2
          done

          docker image prune -f
          EOF
