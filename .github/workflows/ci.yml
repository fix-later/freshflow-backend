name: CI

on:
  push:
    branches: [main, dev-bao, dev]
  pull_request:
    branches: [main, dev-bao, dev]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore FreshFlow.slnx

      - name: Verify formatting
        run: dotnet format FreshFlow.slnx --verify-no-changes

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore FreshFlow.slnx

      - name: Build
        run: dotnet build FreshFlow.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: |
          for proj in tests/Unit/*/; do
            name="$(basename "$proj")"
            dotnet test "$proj" \
              --no-build --configuration Release \
              --logger "trx;LogFileName=$name.trx" \
              --results-directory ./TestResults
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore FreshFlow.slnx

      - name: Build
        run: dotnet build FreshFlow.slnx --no-restore --configuration Release

      - name: Run integration tests
        run: |
          dotnet test tests/Integration/FreshFlow.IntegrationTests/ \
            --no-build --configuration Release \
            --logger "trx;LogFileName=results.trx" \
            --results-directory ./TestResults

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults/
